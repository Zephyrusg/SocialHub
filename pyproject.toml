[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socialhub"
version = "0.1.0"
description = "Private mock-first social media MCP service"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20,<2",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "PyMySQL[rsa]>=1.1,<2",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "pillow>=11,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["static/admin.css", "static/admin.js", "static/fonts/*.ttf", "static/fonts/*.txt"]
