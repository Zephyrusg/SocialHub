events {}
http {
  access_log off;
  error_log /dev/null crit;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 9443 ssl;
    server_name auth.socialhub.test;
    ssl_certificate /local-ca/ca.crt;
    ssl_certificate_key /local-ca/tls.key;
    location / {
      set $idp authelia:9091;
      proxy_pass http://$idp;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
  server {
    listen 9444 ssl;
    server_name hub.socialhub.test socialhub.example.test;
    ssl_certificate /local-ca/ca.crt;
    ssl_certificate_key /local-ca/tls.key;
    client_max_body_size 8k;
    location / {
      set $app socialhub:8000;
      proxy_pass http://$app;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
