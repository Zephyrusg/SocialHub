# Review-only: add ONE new file under /srv/reverse-proxy/nginx/conf.d/.
# Adapt the placeholder paths and snippets to your own reverse proxy.
# Verify the trusted-origin snippet and scheme map before exposure.
upstream socialhub_backend {
    zone socialhub_backend 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server socialhub:8000 resolve;
}
server {
    server_name socialhub.example.test;
    listen 443 ssl;
    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/trusted-origin.conf;
    # Preserve the existing 8088 default/source guard; no global auth_request.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    location = /mcp {
        proxy_pass http://socialhub_backend;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
    location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://socialhub_backend; }
    location /admin/ { proxy_pass http://socialhub_backend; proxy_read_timeout 30s; }
    location /approval/ { proxy_pass http://socialhub_backend; proxy_read_timeout 30s; }
    location = /meta/oauth/start { proxy_pass http://socialhub_backend; proxy_read_timeout 120s; }
    location = /meta/oauth/callback { proxy_pass http://socialhub_backend; proxy_read_timeout 180s; }
    # Google callback uses the same trusted origin and query-free logging.
    location = /youtube/oauth/callback { proxy_pass http://socialhub_backend; proxy_read_timeout 180s; }
    # Media and operational endpoints are intentionally absent in read-only launch.
    # Before media activation: reviewed quotas, streaming bounds, outer log privacy.
    location = /media/upload { return 404; }
    location /media/ {
        # App MEDIA_DELIVERY_ENABLED=false returns 404 at launch. No URI rewrite.
        proxy_pass http://socialhub_backend;
        proxy_read_timeout 180s;
    }
    location / { return 404; }
}
