# Based on /opt/reverseproxy/nginx/nginx.conf; local development only.
events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1m;

    # Bearer authentication is enforced by SocialHub. Browser/Authelia redirects
    # cannot be used on the MCP transport or OAuth resource discovery endpoints.
    location = /mcp {
      proxy_pass http://socialhub:8000/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header X-Accel-Buffering no always;
    }

    location /.well-known/ {
      proxy_pass http://socialhub:8000;
      proxy_set_header Host $http_host;
    }

    location = /healthz {
      proxy_pass http://socialhub:8000/healthz;
      proxy_set_header Host $http_host;
    }
    location = /readyz {
      proxy_pass http://socialhub:8000/readyz;
      proxy_set_header Host $http_host;
    }
    location = /media/upload {
      client_max_body_size 100m;
      proxy_pass http://socialhub:8000;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_request_buffering off;
      proxy_read_timeout 180s;
      access_log off;
      error_log /dev/null crit;
    }
    location /media/ {
      proxy_pass http://socialhub:8000;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      access_log off;
      error_log /dev/null crit;
    }
    location /instagram/story/ {
      proxy_pass http://socialhub:8000;
      proxy_set_header Host $http_host;
      access_log off;
      error_log /dev/null crit;
    }
    location = /metrics {
      proxy_pass http://socialhub:8000/metrics;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
    }
    location /approval/ { access_log off; error_log /dev/null crit; return 404; }
    location /meta/ { access_log off; error_log /dev/null crit; return 404; }
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/socialhub-tls/localhost.crt;
    ssl_certificate_key /etc/nginx/socialhub-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;

    location /approval/ {
      client_max_body_size 8k;
      proxy_pass http://socialhub:8000;
      proxy_set_header Host localhost:8788;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Origin $http_origin;
      proxy_buffering off;
      proxy_read_timeout 30s;
    }

    location = /meta/oauth/start {
      proxy_pass http://socialhub:8000;
      proxy_set_header Host localhost:8788;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Cookie $http_cookie;
      proxy_buffering off;
      proxy_read_timeout 120s;
      add_header Referrer-Policy no-referrer always;
    }
    location = /meta/oauth/callback {
      proxy_pass http://socialhub:8000;
      proxy_set_header Host localhost:8788;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Cookie $http_cookie;
      proxy_buffering off;
      proxy_read_timeout 180s;
      add_header Referrer-Policy no-referrer always;
    }
    location /meta/ { access_log off; error_log /dev/null crit; return 404; }
    location / { return 404; }
  }
}
